<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="idireksyon_frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>idireksyon_frontend</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="maps-config.js"></script>
  <script src="office-directions.js"></script>
  <script>
    // Async Maps scripts are ready at their callback, not their load event.
    window.initGoogleMaps = () => {
      const flutter = document.createElement('script');
      flutter.src = 'flutter_bootstrap.js';
      document.body.appendChild(flutter);
    };
    const key = (window.GOOGLE_MAPS_WEB_API_KEY || '').trim();
    if (key) {
      const maps = document.createElement('script');
      maps.async = true;
      maps.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key)
        + '&loading=async&callback=initGoogleMaps';
      maps.onerror = () => {
        document.body.textContent = 'Google Maps could not load. Check your connection and reload the page.';
      };
      document.head.appendChild(maps);
    } else {
      document.body.textContent = 'Google Maps is not configured. Set GOOGLE_MAPS_WEB_API_KEY in web/maps-config.js and restart the app.';
    }
  </script>
</body>
</html>
